name: Conditional CI Pipeline

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Build Actions
        run: |
          echo "Executing build job..."
          echo "Build completed successfully."

  test:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/heads/feature/') && success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Test Actions
        run: |
          echo "Executing test job because this is a feature branch and build succeeded."
          echo "Tests completed successfully."
